name: Apply Phase 22 database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply pending migrations in one PostgreSQL session
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DB_URL="$(printf '%s' "${SUPABASE_DB_URL}" | tr -d '\r\n' | xargs)"
          test -n "${DB_URL}" || { echo "SUPABASE_DB_URL não configurado"; exit 1; }
          case "${DB_URL}" in
            postgresql://*|postgres://*) ;;
            *) echo "SUPABASE_DB_URL inválido: use uma connection string PostgreSQL (postgresql:// ou postgres://)."; exit 1 ;;
          esac
          case "${DB_URL}" in
            *"@"*:*"/"*) ;;
            *) echo "SUPABASE_DB_URL inválido: a connection string deve conter host, porta e banco."; exit 1 ;;
          esac
          psql --version

          psql "${SUPABASE_DB_URL}" -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;

          select to_regclass('public.api_rate_limit_buckets') is not null as migration_0009_done \gset
          \if :migration_0009_done
            \echo '0009 já aplicada; validando função'
          \else
            \echo 'Aplicando 0009'
            \i drizzle/migrations/0009_api_rate_limits.sql
          \endif

          select to_regclass('public.api_idempotency_keys') is not null as migration_0010_done \gset
          \if :migration_0010_done
            \echo '0010 já aplicada'
          \else
            \echo 'Aplicando 0010'
            \i drizzle/migrations/0010_api_idempotency.sql
          \endif

          select to_regclass('public.api_audit_events') is not null as migration_0011_done \gset
          \if :migration_0011_done
            \echo '0011 já aplicada'
          \else
            \echo 'Aplicando 0011'
            \i drizzle/migrations/0011_api_audit_events.sql
          \endif

          select exists (
            select 1 from information_schema.columns
            where table_schema = 'public'
              and table_name = 'webhook_events'
              and column_name = 'payload_hash'
          ) as migration_0012_done \gset
          \if :migration_0012_done
            \echo '0012 já aplicada; validando retenção'
          \else
            \echo 'Aplicando 0012'
            \i drizzle/migrations/0012_webhook_data_minimization.sql
          \endif

          select to_regclass('public.profiles') is not null as migration_0013_done \gset
          \if :migration_0013_done
            \echo '0013 já aplicada; validando profiles'
          \else
            \echo 'Aplicando 0013'
            \i drizzle/migrations/0013_auth_onboarding.sql
          \endif

          select exists (
            select 1
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname = 'handle_new_user_profile'
              and p.prosecdef
          ) as migration_0015_done \gset
          \if :migration_0015_done
            \echo '0015 já aplicada; validando trigger de perfil'
          \else
            \echo 'Aplicando 0015'
            \i drizzle/migrations/0015_fix_auth_profile_trigger.sql
          \endif

          \echo 'Aplicando/validando 0014'
          \i drizzle/migrations/0014_charge_integration_backfill.sql

          select exists (
            select 1
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname = 'save_picpay_integration'
          ) as migration_0016_done \gset
          \if :migration_0016_done
            \echo '0016 já aplicada; validando função'
          \else
            \echo 'Aplicando 0016'
            \i drizzle/migrations/0016_picpay_integration_vault_management.sql
          \endif

          select exists (
            select 1 from pg_constraint
            where conrelid = 'public.payment_integrations'::regclass
              and conname = 'payment_integrations_provider_check'
              and pg_get_constraintdef(oid) like '%ASAAS%'
          ) as migration_0017_done \gset
          \if :migration_0017_done
            \echo '0017 já aplicada; validando multi-provider'
          \else
            \echo 'Aplicando 0017'
            \i drizzle/migrations/0017_multi_provider_payments.sql
          \endif

          select exists (
            select 1 from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname = 'save_inter_integration'
          ) as migration_0018_done \gset
          \if :migration_0018_done
            \echo '0018 já aplicada; validando Banco Inter'
          \else
            \echo 'Aplicando 0018'
            \i drizzle/migrations/0018_banco_inter_pix.sql
          \endif

          select exists (
            select 1 from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public' and p.proname = 'save_efi_integration'
          ) as migration_0019_done \gset
          \if :migration_0019_done
            \echo '0019 já aplicada; validando Efí Bank'
          \else
            \echo 'Aplicando 0019'
            \i drizzle/migrations/0019_efi_pix.sql
          \endif

          commit;

          select
            to_regclass('public.api_rate_limit_buckets') as rate_limits,
            to_regclass('public.api_idempotency_keys') as idempotency,
            to_regclass('public.api_audit_events') as audit_events,
            to_regclass('public.charges') as charges,
            (select count(*) from public.charges where payment_integration_id is null) as legacy_charges,
            exists (
              select 1 from pg_proc
              where proname = 'consume_api_rate_limit'
            ) as rate_limit_function,
            exists (
              select 1 from pg_indexes
              where indexname = 'api_idempotency_created_idx'
            ) as idempotency_index,
            exists (
              select 1 from pg_indexes
              where indexname = 'api_audit_events_created_idx'
            ) as audit_index,
            exists (
              select 1 from pg_indexes
              where indexname = 'charges_legacy_backfill_idx'
            ) as backfill_index;
          SQL
